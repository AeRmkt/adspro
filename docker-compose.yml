version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adspro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adspro
      POSTGRES_PASSWORD: adspro_secret
      POSTGRES_DB: adspro_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adspro -d adspro_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adspro_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
